version: "3.9"

services:
  # ── CipherLink API ─────────────────────────────────────────────────
  cipherlink-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherlink-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - cipherlink-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cipherlink-net
    restart: unless-stopped

  # ── CipherLink Web (Vue Dashboard) ─────────────────────────────────
  cipherlink-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cipherlink-web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cipherlink-net
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cipherlink-postgres
    environment:
      POSTGRES_DB: cipherlink
      POSTGRES_USER: cipherlink
      POSTGRES_PASSWORD: cipherlink_secret
    ports:
      - "5433:5432"
    volumes:
      - cipherlink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherlink"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cipherlink-net
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cipherlink-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cipherlink-net
    restart: unless-stopped

  # ── Nginx ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cipherlink-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cipherlink-api
      - cipherlink-web
    networks:
      - cipherlink-net
    restart: unless-stopped

volumes:
  cipherlink-pgdata:
  cipherlink-storage:

networks:
  cipherlink-net:
    driver: bridge
